[tips-and-tricks-description]
sb-angels-petrochem=A mod that overhauls petrochemical processing to be more complex and pseudo-realistic (not overly so).\nRaw resources have to be processed and transformed through chemical processing chains to gain:\n__1__\n
sb-angels-nauvis-trees=By exploring the sea you find islands with special trees growing in their sandy middle. They are the only trees in Sea Block.\nExtract seeds out of these trees and start growing your own trees as a renewable source of [item=wood]. More advanced processing leads to more advanced tree growth, allowing you to extract Resin, Plastic and Rubber out of these special trees.\n\nThese trees are marked with a [font=default-bold]light blue square[/font] on the minimap. Each kind grows in its own areas, so you may have to reach several islands to find all three.\n
sb-angels-nauvis-notes-trees=[font=default-bold]NOTES[/font]: Gardens of the same kind grow in the same areas.
sb-angels-bioprocessing-vegetables=By exploring the sea you find [img=item/angels-desert-garden][img=item/angels-swamp-garden][img=item/angels-temperate-garden]gardens that you can investigate and refine to seeds. These seeds allow you to grow plants yourself. Process these plants for nutrients, fuel and oils. These gardens can also be processed for [img=item/angels-token-bio]Plant Life Samples for use in researching advanced farming buildings such as farm upgrades, more efficient wood recipes and more advanced processes.\n\nThese gardens are marked with a [font=default-bold]light green square[/font] on the minimap. They grow in the sandy middle of some islands, in the same areas as the special trees of the same kind.\n

[tips-and-tricks-sub]
sb-angels-trees-desert=Desert trees are used for wood production or as an early raw material for [img=item/angels-bio-rubber] Rubber production.\n
sb-angels-trees-temperate=Temperate trees are used for wood production or as an early raw material for [img=item/angels-bio-resin] Resin production.\n
sb-angels-trees-swamp=Swamp trees are used for wood production or as an early raw material for [img=item/angels-bio-plastic] Plastic production.\n\n
